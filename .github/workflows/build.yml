name: build

on:
  push:
    branches: [c-port]
  pull_request:
    branches: [c-port]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: c-port

      - name: Build (gcc)
        run: make

      - name: HTTP smoke test (multi-thread)
        run: |
          python3 -c "open('/tmp/big.bin','wb').write(bytes(((i*31+7)&0xFF) for i in range(6*1024*1024)))"
          sha256sum /tmp/big.bin | tee /tmp/big.sha
          cat > /tmp/httpd.py <<'EOF'
          import http.server
          DATA = open('/tmp/big.bin','rb').read()
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_HEAD(self):
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(DATA)))
                  self.send_header('Accept-Ranges', 'bytes')
                  self.end_headers()
              def do_GET(self):
                  rg = self.headers.get('Range')
                  a, b = 0, len(DATA)-1
                  code = 200
                  if rg and rg.startswith('bytes='):
                      s = rg[6:].split('-')
                      a = int(s[0] or 0)
                      b = int(s[1]) if len(s) > 1 and s[1] else len(DATA)-1
                      code = 206
                  self.send_response(code)
                  if code == 206:
                      self.send_header('Content-Range', 'bytes %d-%d/%d' % (a, b, len(DATA)))
                  else:
                      self.send_header('Accept-Ranges', 'bytes')
                  self.send_header('Content-Length', str(b-a+1))
                  self.end_headers()
                  self.wfile.write(DATA[a:b+1])
          http.server.HTTPServer(('127.0.0.1', 18080), H).serve_forever()
          EOF
          (nohup python3 /tmp/httpd.py > /tmp/httpd.log 2>&1 &) ; sleep 1
          printf 'http://127.0.0.1:18080/big.bin\ntest_dl.bin\n8\ny\n' | timeout 120 ./downloader
          echo "exit=$?"
          cmp test_dl.bin /tmp/big.bin && echo "HTTP CONTENT OK"
          rm -f test_dl.bin history.csv
          pkill -f /tmp/httpd.py || true

      - name: HTTPS smoke test (BearSSL + system CA)
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ca.key -out /tmp/ca.crt -days 2 -nodes -subj "/CN=Test CA" 2>/dev/null
          openssl req -newkey rsa:2048 -keyout /tmp/srv.key -out /tmp/srv.csr -nodes -subj "/CN=localhost" 2>/dev/null
          printf 'subjectAltName=DNS:localhost' > /tmp/ext.cnf
          openssl x509 -req -in /tmp/srv.csr -CA /tmp/ca.crt -CAkey /tmp/ca.key -CAcreateserial -out /tmp/srv.crt -days 2 -extfile /tmp/ext.cnf 2>/dev/null
          sudo cp /tmp/ca.crt /usr/local/share/ca-certificates/dltest-ca.crt
          sudo update-ca-certificates
          cat > /tmp/httpsd.py <<'EOF'
          import http.server, ssl
          DATA = open('/tmp/big.bin','rb').read()
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_HEAD(self):
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(DATA)))
                  self.send_header('Accept-Ranges', 'bytes')
                  self.end_headers()
              def do_GET(self):
                  rg = self.headers.get('Range')
                  a, b = 0, len(DATA)-1
                  code = 200
                  if rg and rg.startswith('bytes='):
                      s = rg[6:].split('-')
                      a = int(s[0] or 0)
                      b = int(s[1]) if len(s) > 1 and s[1] else len(DATA)-1
                      code = 206
                  self.send_response(code)
                  if code == 206:
                      self.send_header('Content-Range', 'bytes %d-%d/%d' % (a, b, len(DATA)))
                  else:
                      self.send_header('Accept-Ranges', 'bytes')
                  self.send_header('Content-Length', str(b-a+1))
                  self.end_headers()
                  self.wfile.write(DATA[a:b+1])
          srv = http.server.HTTPServer(('127.0.0.1', 18443), H)
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain('/tmp/srv.crt', '/tmp/srv.key')
          srv.socket = ctx.wrap_socket(srv.socket, server_side=True)
          srv.serve_forever()
          EOF
          (nohup python3 /tmp/httpsd.py > /tmp/httpsd.log 2>&1 &) ; sleep 1
          ss -ltn | grep 18443 || echo "NOT LISTENING"
          echo "--- curl probe (reference client) ---"
          curl -v --cacert /tmp/ca.crt --max-time 20 -o /tmp/curl.bin https://localhost:18443/big.bin 2>&1 | tail -15 || echo "curl exit=$?"
          cmp /tmp/curl.bin /tmp/big.bin && echo "CURL CONTENT OK"
          echo "--- our downloader ---"
          printf 'https://localhost:18443/big.bin\ntest_tls.bin\n8\ny\n' | timeout 120 ./downloader
          echo "exit=$?"
          cmp test_tls.bin /tmp/big.bin && echo "HTTPS CONTENT OK"
          rm -f test_tls.bin history.csv
          echo "--- server log ---"
          cat /tmp/httpsd.log
          pkill -f /tmp/httpsd.py || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-linux
          path: |
            downloader
            third_party/cacert.pem

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: c-port

      - name: Setup MSYS2 + MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make make

      - name: Build (MinGW gcc)
        shell: msys2 {0}
        run: mingw32-make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-windows
          path: |
            downloader.exe
            third_party/cacert.pem
