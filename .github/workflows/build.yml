name: build

on:
  push:
    branches: [c-port]
  pull_request:
    branches: [c-port]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: c-port

      - name: Build (gcc)
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-linux
          path: downloader

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: c-port

      - name: Setup MSYS2 + MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make make

      - name: Build (MinGW gcc)
        shell: msys2 {0}
        run: mingw32-make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloader-windows
          path: downloader.exe
